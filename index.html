<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Firewall Defender: Virus Attack v2</title>
    <style>
        :root {
            --bg: #050508;
            --panel: rgba(12, 12, 16, 0.9);
            --line: rgba(255,255,255,0.08);
            --text: #ffffff;
            --muted: #8a8fbc;
            --accent: #ff3366;
            --accent-2: #ff6633;
            --good: #33ff66;
            --warn: #ffff33;
            --blue: #3366ff;
            --cyan: #00ffff;
            --magenta: #ff00ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        #intro-screen {
            position: fixed; inset: 0;
            background: #000000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }
        .intro-text {
            font-family: 'Lucida Handwriting', 'Zapf Chancery', 'Bickham Script Pro', cursive;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 300;
            color: white;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            animation: calligraphyFade 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            text-shadow: 0 0 20px rgba(255,255,255,0.35), 0 0 40px rgba(255,255,255,0.1);
        }
        .intro-sub {
            font-size: 0.72rem;
            letter-spacing: 6px;
            color: #555;
            text-transform: uppercase;
            margin-top: 16px;
            opacity: 0;
            animation: subFade 3s 1.5s ease forwards;
        }
        @keyframes calligraphyFade {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.92); }
            30% { opacity: 1; filter: blur(0px); transform: scale(1); }
            70% { opacity: 1; filter: blur(0px); transform: scale(1); }
            100% { opacity: 0; filter: blur(12px); transform: scale(1.05); }
        }
        @keyframes subFade {
            0% { opacity: 0; letter-spacing: 0px; }
            100% { opacity: 1; letter-spacing: 6px; }
        }

        #grid-bg {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(5, 5, 8, 0.96);
            border-bottom: 2px solid var(--line);
            backdrop-filter: blur(12px);
        }

        .brand { display: flex; flex-direction: column; }
        .title {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: var(--text);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .high-score {
            font-size: 0.75rem;
            color: #666;
            margin-top: 2px;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 18px;
            font-weight: 700;
        }
        .stat-box {
            background: rgba(255,255,255,0.02);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 80px;
        }
        .stat-label {
            color: #666;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .stat-val {
            font-size: 1.1rem;
            text-shadow: 0 0 5px currentColor;
        }

        #health-container {
            display: flex;
            flex-direction: column;
            width: 120px;
        }
        #health-bar-wrap {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 3px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: var(--good);
            transition: width 0.2s ease, background 0.2s ease;
        }

        #game-area {
            position: relative;
            z-index: 5;
            flex: 1;
            overflow: hidden;
            cursor: crosshair;
        }

        .virus {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            color: inherit;
            box-shadow: 0 0 20px currentColor;
            transition: transform 0.1s ease, box-shadow 0.15s ease;
            animation: floatAnim 4s ease-in-out infinite alternate;
            overflow: visible;
        }
        .virus:hover {
            transform: scale(1.04);
        }
        .virus:active { transform: scale(0.88); }
        .virus.boss {
            border-width: 3px !important;
            box-shadow: 0 0 30px currentColor, 0 0 55px rgba(255,255,255,0.15);
        }
        .virus-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.58rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            text-shadow: 0 0 6px rgba(255,255,255,0.3);
            white-space: nowrap;
        }
        @keyframes floatAnim {
            0% { border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; }
            100% { border-radius: 60% 40% 40% 60% / 60% 60% 40% 40%; }
        }

        .splash {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: splashEffect 0.55s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 6;
        }
        @keyframes splashEffect {
            0% { transform: scale(0); opacity: 1; border: 4px solid currentColor; }
            50% { opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; border: 1px solid currentColor; background: currentColor; filter: blur(5px); }
        }

        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 8, 12, 0.95);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .bold-banner {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
        }
        .subtitle {
            color: var(--muted);
            margin-bottom: 26px;
            max-width: 420px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .btn, .sound-btn {
            border: none;
            cursor: pointer;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 999px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            box-shadow: 0 5px 25px rgba(255, 51, 102, 0.4);
        }
        .sound-btn {
            margin-top: 15px;
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            font-size: 0.75rem;
        }
        .btn:hover, .sound-btn:hover {
            transform: translateY(-2px);
        }
        .btn:active, .sound-btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 680px) {
            header {
                padding: 12px 12px;
            }
            .stats {
                gap: 8px;
            }
            .stat-box {
                min-width: 62px;
                padding: 4px 8px;
            }
            #health-container {
                width: 90px;
            }
            .subtitle {
                font-size: 0.9rem;
            }
            .intro-sub {
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div class="intro-text">Firewall Defender</div>
        <div class="intro-sub">SYSTEM BOOT SEQUENCE</div>
    </div>

    <div id="grid-bg"></div>

    <header>
        <div class="brand">
            <div class="title">Virus Attack</div>
            <div class="high-score">High Score: <span id="high-score-val">0</span></div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div class="stat-val" id="score-val" style="color:#ff3366;">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Lives</div>
                <div class="stat-val" id="lives-val" style="color:#33ff66;">5</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div class="stat-val" id="level-val" style="color:#00ffff;">1</div>
            </div>
            <div id="health-container">
                <div class="stat-label">Shield</div>
                <div id="health-bar-wrap"><div id="health-bar"></div></div>
            </div>
        </div>
    </header>

    <div id="game-area">
        <div id="menu-overlay">
            <h1 class="bold-banner" id="menu-title">Virus Attack</h1>
            <p class="subtitle" id="menu-sub">System compromised. Purge the viral anomalies before they breach the core infrastructure.</p>
            <button class="btn" id="start-btn">Initialize Purge</button>
            <button class="sound-btn" id="sound-btn">Sound: ON</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const scoreVal = document.getElementById('score-val');
        const livesVal = document.getElementById('lives-val');
        const levelVal = document.getElementById('level-val');
        const menuOverlay = document.getElementById('menu-overlay');
        const startBtn = document.getElementById('start-btn');
        const soundBtn = document.getElementById('sound-btn');
        const menuTitle = document.getElementById('menu-title');
        const menuSub = document.getElementById('menu-sub');
        const healthBar = document.getElementById('health-bar');
        const introScreen = document.getElementById('intro-screen');
        const highScoreVal = document.getElementById('high-score-val');

        const state = {
            score: 0,
            lives: 5,
            level: 1,
            gameActive: false,
            spawnLoop: null,
            spawnId: 0,
            highScore: Number(localStorage.getItem('virusHighScore')) || 0,
            soundEnabled: true,
            audioCtx: null
        };

        const virusColors = ['#ff3366', '#33ff66', '#3366ff', '#ffff33', '#00ffff', '#ff00ff'];

        function getAudioCtx() {
            if (!state.audioCtx) {
                const AudioCtor = window.AudioContext || window.webkitAudioContext;
                if (AudioCtor) state.audioCtx = new AudioCtor();
            }
            if (state.audioCtx && state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
            return state.audioCtx;
        }

        function playTone({ frequency = 440, type = 'square', duration = 0.08, volume = 0.03, slide = 0 }) {
            if (!state.soundEnabled) return;
            const ctx = getAudioCtx();
            if (!ctx) return;

            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
            if (slide) oscillator.frequency.linearRampToValueAtTime(frequency + slide, ctx.currentTime + duration);

            gain.gain.setValueAtTime(volume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.start();
            oscillator.stop(ctx.currentTime + duration);
        }

        function playHitSound(isBoss = false) {
            playTone({ frequency: isBoss ? 180 : 500, type: 'triangle', duration: 0.06, volume: 0.04, slide: isBoss ? 80 : 70 });
            if (isBoss) {
                setTimeout(() => playTone({ frequency: 120, type: 'sawtooth', duration: 0.12, volume: 0.03, slide: 60 }), 50);
            }
        }

        function playMissSound() {
            playTone({ frequency: 180, type: 'sawtooth', duration: 0.1, volume: 0.04, slide: -50 });
        }

        function playWinSound() {
            playTone({ frequency: 660, type: 'triangle', duration: 0.12, volume: 0.04, slide: 80 });
            setTimeout(() => playTone({ frequency: 820, type: 'triangle', duration: 0.12, volume: 0.04, slide: 90 }), 80);
        }

        function updateHud() {
            scoreVal.textContent = state.score;
            livesVal.textContent = state.lives;
            levelVal.textContent = state.level;
            highScoreVal.textContent = state.highScore;

            const shieldPercent = Math.max(0, (state.lives / 5) * 100);
            healthBar.style.width = `${shieldPercent}%`;
            healthBar.style.background = shieldPercent > 60 ? '#33ff66' : shieldPercent > 30 ? '#ffff33' : '#ff3366';
        }

        function hideIntro() {
            if (introScreen) {
                introScreen.style.opacity = '0';
                setTimeout(() => introScreen.style.display = 'none', 1000);
            }
        }

        function resetGame() {
            state.score = 0;
            state.lives = 5;
            state.level = 1;
            state.gameActive = true;
            state.spawnId = 0;
            updateHud();
            menuOverlay.style.display = 'none';
            document.body.style.backgroundColor = '#0d0e15';
            clearInterval(state.spawnLoop);
            scheduleSpawns();
        }

        function currentDifficulty() {
            const levelFactor = (state.level - 1) * 120;
            return Math.max(330, 1500 - state.score * 0.35 - levelFactor);
        }

        function scheduleSpawns() {
            if (!state.gameActive) return;
            spawnVirus();
            clearInterval(state.spawnLoop);
            state.spawnLoop = setInterval(() => {
                if (!state.gameActive) return;
                spawnVirus();
            }, currentDifficulty());
        }

        function maybeLevelUp() {
            const nextLevel = Math.floor(state.score / 150) + 1;
            if (nextLevel !== state.level) {
                state.level = nextLevel;
                updateHud();
                playWinSound();
            }
        }

        function spawnVirus() {
            if (!state.gameActive) return;

            const bossChance = state.level >= 2 && Math.random() < 0.12 + state.level * 0.02;
            if (bossChance) {
                spawnBossVirus();
                return;
            }

            const virus = document.createElement('div');
            virus.classList.add('virus');

            const size = 48 + Math.random() * 43;
            const color = virusColors[Math.floor(Math.random() * virusColors.length)];
            const hp = 1;

            virus.style.width = `${size}px`;
            virus.style.height = `${size}px`;
            virus.style.color = color;
            virus.style.background = `radial-gradient(circle, rgba(13, 14, 21, 0.9) 18%, ${color} 100%)`;
            virus.style.border = `2px solid ${color}`;

            const maxX = Math.max(0, gameArea.clientWidth - size);
            const maxY = Math.max(0, gameArea.clientHeight - size);
            virus.style.left = `${Math.random() * maxX}px`;
            virus.style.top = `${Math.random() * maxY}px`;

            virus.dataset.hp = hp;
            virus.dataset.maxHp = hp;
            virus.dataset.points = '10';
            virus.dataset.type = 'normal';

            const timeout = setTimeout(() => {
                if (document.body.contains(virus)) {
                    virus.remove();
                    loseLife();
                    playMissSound();
                }
            }, Math.max(1400, 4300 - state.score * 0.45 - state.level * 120));

            virus.addEventListener('touchstart', (e) => {
                e.preventDefault();
                hitVirus(virus, timeout);
            }, { passive: false });
            virus.addEventListener('mousedown', () => hitVirus(virus, timeout));

            gameArea.appendChild(virus);
        }

        function spawnBossVirus() {
            const boss = document.createElement('div');
            boss.classList.add('virus', 'boss');

            const size = 95 + Math.random() * 75;
            const color = ['#ff3366', '#00ffff', '#33ff66'][Math.floor(Math.random() * 3)];
            const hp = 3 + Math.floor(state.level / 2);

            boss.style.width = `${size}px`;
            boss.style.height = `${size}px`;
            boss.style.color = color;
            boss.style.background = `radial-gradient(circle, rgba(10,10,18,0.75) 20%, ${color} 100%)`;
            boss.style.border = `3px solid ${color}`;

            const maxX = Math.max(0, gameArea.clientWidth - size);
            const maxY = Math.max(0, gameArea.clientHeight - size);
            boss.style.left = `${Math.random() * maxX}px`;
            boss.style.top = `${Math.random() * maxY}px`;

            boss.dataset.hp = hp;
            boss.dataset.maxHp = hp;
            boss.dataset.points = String(50 + state.level * 25);
            boss.dataset.type = 'boss';

            const label = document.createElement('div');
            label.className = 'virus-label';
            label.textContent = 'BOSS';
            boss.appendChild(label);

            const timeout = setTimeout(() => {
                if (document.body.contains(boss)) {
                    boss.remove();
                    loseLife();
                    playMissSound();
                }
            }, Math.max(2200, 5000 - state.level * 220));

            boss.addEventListener('touchstart', (e) => {
                e.preventDefault();
                hitVirus(boss, timeout);
            }, { passive: false });
            boss.addEventListener('mousedown', () => hitVirus(boss, timeout));

            gameArea.appendChild(boss);
        }

        function hitVirus(virus, timeout) {
            if (!state.gameActive) return;

            const currentHp = Number(virus.dataset.hp || 1);
            if (currentHp <= 1) {
                destroyVirus(virus, timeout);
                return;
            }

            virus.dataset.hp = String(currentHp - 1);
            const isBoss = virus.dataset.type === 'boss';
            const glow = isBoss ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.18)';
            virus.style.boxShadow = `0 0 18px ${virus.style.color}, 0 0 22px ${glow}`;
            playHitSound(isBoss);

            const flash = document.createElement('div');
            flash.classList.add('splash');
            flash.style.color = virus.style.color;
            flash.style.width = virus.style.width;
            flash.style.height = virus.style.height;
            const rect = virus.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            flash.style.left = `${rect.left - areaRect.left}px`;
            flash.style.top = `${rect.top - areaRect.top}px`;
            gameArea.appendChild(flash);
            setTimeout(() => flash.remove(), 300);
        }

        function destroyVirus(virus, timeout) {
            clearTimeout(timeout);
            const isBoss = virus.dataset.type === 'boss';
            const points = Number(virus.dataset.points || 10);
            const rect = virus.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();

            const splash = document.createElement('div');
            splash.classList.add('splash');
            splash.style.color = virus.style.color;
            splash.style.width = virus.style.width;
            splash.style.height = virus.style.height;
            splash.style.left = `${rect.left - areaRect.left}px`;
            splash.style.top = `${rect.top - areaRect.top}px`;
            gameArea.appendChild(splash);
            setTimeout(() => splash.remove(), 500);

            virus.remove();
            state.score += points;
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('virusHighScore', String(state.highScore));
            }
            maybeLevelUp();
            updateHud();
            playHitSound(isBoss);
            document.body.style.backgroundColor = virus.style.color + '15';
            setTimeout(() => {
                if (state.gameActive) document.body.style.backgroundColor = '#0d0e15';
            }, 180);
        }

        function loseLife() {
            state.lives -= 1;
            updateHud();
            if (state.lives <= 0) {
                endGame();
            }
        }

        function endGame() {
            state.gameActive = false;
            clearInterval(state.spawnLoop);
            document.querySelectorAll('.virus').forEach((v) => v.remove());

            menuTitle.textContent = 'SYSTEM CRASH';
            menuTitle.style.color = '#ff3333';
            menuSub.innerHTML = `Infection successful.<br><strong style="font-size:1.4rem;color:#fff;">FINAL SCORE: ${state.score}</strong>`;
            startBtn.textContent = 'REBOOT & PURGE';
            menuOverlay.style.display = 'flex';
            updateHud();
        }

        function startGame() {
            state.gameActive = true;
            state.level = 1;
            state.score = 0;
            state.lives = 5;
            menuTitle.style.color = '#ff3366';
            menuSub.textContent = 'System compromised. Purge the viral anomalies before they breach the core infrastructure.';
            startBtn.textContent = 'Initialize Purge';
            hideIntro();
            resetGame();
        }

        soundBtn.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            soundBtn.textContent = `Sound: ${state.soundEnabled ? 'ON' : 'OFF'}`;
            soundBtn.style.opacity = state.soundEnabled ? '1' : '0.65';
        });

        startBtn.addEventListener('click', startGame);

        updateHud();

        window.addEventListener('load', () => {
            setTimeout(() => hideIntro(), 4200);
        });
    </script>
</body>
</html>
